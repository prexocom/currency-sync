name: Update Exchange Rates

on:
  schedule:
    - cron: '0 */16 * * *'  # every 8 hours
  workflow_dispatch:

permissions:
 contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install axios

      - name: Run update script
        env:
          EXCHANGERATE_API_KEY: ${{ secrets.EXCHANGERATE_API_KEY }}
        run: node updateRates.js

      - name: Commit and push updated rates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git commit -m "Update exchange rates"
          git push
        # Optionally, set up push permissions or a PAT token if required
